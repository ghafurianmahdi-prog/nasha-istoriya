      - name: Build APK
        run: |
          cd our_story_android
          sed -i 's/VERSION_1_8/VERSION_17/g; s/JVM_1_8/JVM_17/g; s/"1.8"/"17"/g' app/build.gradle
          gradle assembleDebug
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -o okanochka_android_cloud_build.zip

      - name: Build APK
        run: |
          cd our_story_android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nasha-istoriya-apk
          path: our_story_android/app/build/outputs/apk/debug/app-debug.apk
